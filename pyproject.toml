[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scenemind-x"
version = "0.1.0"
description = "Evidence-grounded multimodal visual asset intelligence"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10,<14",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "jsonschema[format]>=4,<5",
]
vlm = [
  "accelerate>=1.14,<2",
  "modelscope>=1.38,<2",
  "opencc-python-reimplemented==0.1.7",
  "transformers>=5.12,<6",
]
server = [
  "fastapi>=0.138,<1",
  "uvicorn>=0.49,<1",
  "numpy>=2,<3",
  "psutil>=7,<8",
]
embedding = [
  "transformers>=5.12,<6",
]
retrieval = [
  "faiss-cpu>=1.12,<2",
  "jieba==0.42.1",
]
# Provisional until the complete server MVP has exercised all image paths.
embedding-modelscope = [
  "modelscope>=1.38,<2",
  "opencv-python-headless==4.13.0.92",
  "simplejson==3.20.2",
  "sortedcontainers==2.4.0",
  "timm==1.0.28",
]
ocr-cpu = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
