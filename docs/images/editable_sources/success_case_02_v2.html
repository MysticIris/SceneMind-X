<!doctype html><html style="--h:1420px"><head><meta charset="utf-8"><link rel="stylesheet" href="v2_asset_style.css"></head><body><div class="canvas">
<div class="topline"><span class="tag">多图理解</span><span class="title">多图理解与比较</span></div>
<div class="input-grid" style="grid-template-columns:1fr 1fr;height:650px">
  <div class="image-box"><span class="image-label">IMG_1</span><img src="../../../../paper/figures/appendix_cases/comparison_1.jpg"></div>
  <div class="image-box"><span class="image-label">IMG_2</span><img src="../../../../paper/figures/appendix_cases/comparison_2.jpg"></div>
</div>
<div class="stack">
  <div class="card soft"><div class="section-label">用户问题</div><div class="question">比较两张道路照片的天气、光线、路面状态和驾驶风险提示，只依据可见证据。</div></div>
  <div class="card"><div class="section-label">系统回答</div><div class="answer">IMG_1 为雨夜城市街道，能见度低且路面湿滑反光；IMG_2 为冬季清晨或黄昏的高速公路，路侧积雪、路面有冰雪痕迹。两者在天气与路面状态上差异显著：前者主要风险来自雨水导致的视线模糊和制动距离增加，后者主要风险来自低温带来的路面结冰与附着力下降。</div></div>
</div></div></body></html>
