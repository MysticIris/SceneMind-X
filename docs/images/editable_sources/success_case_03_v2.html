<!doctype html><html style="--h:1500px"><head><meta charset="utf-8"><link rel="stylesheet" href="v2_asset_style.css"></head><body><div class="canvas">
<div class="topline"><span class="tag">图片排序</span><span class="title">技术图片排序</span></div>
<div class="input-grid" style="grid-template-columns:repeat(4,1fr);height:560px">
  <div class="image-box"><span class="image-label">IMG_1</span><img src="../../../../paper/figures/appendix_cases/ranking_1.png"></div>
  <div class="image-box"><span class="image-label">IMG_2</span><img src="../../../../paper/figures/appendix_cases/ranking_2.png"></div>
  <div class="image-box"><span class="image-label">IMG_3</span><img src="../../../../paper/figures/appendix_cases/ranking_3.png"></div>
  <div class="image-box"><span class="image-label">IMG_4</span><img src="../../../../paper/figures/appendix_cases/ranking_4.png"></div>
</div>
<div class="stack">
  <div class="card soft"><div class="section-label">用户任务</div><div class="question">按照四幅图片作为论文技术结构讲解素材的适合程度进行排序，并说明每张图的理由。</div></div>
  <div class="card"><div class="section-label">系统回答</div><div class="answer">我更推荐 IMG_4 作为论文技术结构讲解素材，排序为 IMG_4 &gt; IMG_3 &gt; IMG_1 &gt; IMG_2。IMG_4 是深度学习模型架构图，包含 Encoder--Decoder、Conformer 模块及数据流向，抽象层级高；IMG_3 是逻辑电路或纠错编码框图，结构相对简单；IMG_1 是详细硬件电路原理图，信息密度较大；IMG_2 同时包含电源、USB、音频和网络等多个模块，较难聚焦于单一结构。</div></div>
</div></div></body></html>
