<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1080" viewBox="0 0 2400 1080">
  <defs>
    <style>
      .cn{font-family:'Microsoft YaHei','DengXian','SimHei',sans-serif;fill:#243746}.white{fill:#fff!important}
      .laneTitle{font-size:34px;font-weight:700}.nodeTitle{font-size:28px;font-weight:700}.nodeSub{font-size:23px}.note{font-size:22px}
      .node{fill:#fff;stroke:#97C4E6;stroke-width:3}.node2{fill:#F3F9FD;stroke:#3476B2;stroke-width:3}
      .arrow{fill:none;stroke:#3476B2;stroke-width:5;marker-end:url(#arrow)}
      .optional{fill:#FFF;stroke:#7BAED1;stroke-width:3;stroke-dasharray:10 8}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3476B2"/>
    </marker>
  </defs>
  <rect width="2400" height="1080" fill="#fff"/>

  <!-- lane backgrounds -->
  <rect x="24" y="24" width="2352" height="238" rx="24" fill="#F7FCFF" stroke="#D1E4F4" stroke-width="2"/>
  <rect x="24" y="286" width="2352" height="238" rx="24" fill="#FBFDFF" stroke="#D1E4F4" stroke-width="2"/>
  <rect x="24" y="548" width="2352" height="238" rx="24" fill="#F7FCFF" stroke="#D1E4F4" stroke-width="2"/>
  <rect x="24" y="810" width="2352" height="238" rx="24" fill="#FBFDFF" stroke="#D1E4F4" stroke-width="2"/>

  <!-- labels -->
  <rect x="48" y="70" width="245" height="146" rx="20" fill="#1DA4FF"/>
  <text x="170" y="130" text-anchor="middle" class="cn laneTitle white">视觉问答</text>
  <text x="170" y="173" text-anchor="middle" class="cn nodeSub white">Visual QA</text>
  <rect x="48" y="332" width="245" height="146" rx="20" fill="#3476B2"/>
  <text x="170" y="392" text-anchor="middle" class="cn laneTitle white">视觉检索</text>
  <text x="170" y="435" text-anchor="middle" class="cn nodeSub white">Retrieval</text>
  <rect x="48" y="594" width="245" height="146" rx="20" fill="#6D91C7"/>
  <text x="170" y="654" text-anchor="middle" class="cn laneTitle white">比较 / 排序</text>
  <text x="170" y="697" text-anchor="middle" class="cn nodeSub white">Compare / Rank</text>
  <rect x="48" y="856" width="245" height="146" rx="20" fill="#215F9A"/>
  <text x="170" y="916" text-anchor="middle" class="cn laneTitle white">内容生成</text>
  <text x="170" y="959" text-anchor="middle" class="cn nodeSub white">Content</text>

  <!-- common node positions: x 330, 680, 1030, 1380, 1730, 2080; width 270 -->
  <!-- VQA -->
  <g>
    <rect x="330" y="84" width="270" height="118" rx="16" class="node"/>
    <text x="465" y="132" text-anchor="middle" class="cn nodeTitle">图片 + 问题</text><text x="465" y="170" text-anchor="middle" class="cn nodeSub">选择或自然引用</text>
    <rect x="680" y="84" width="270" height="118" rx="16" class="node2"/>
    <text x="815" y="132" text-anchor="middle" class="cn nodeTitle">图片引用解析</text><text x="815" y="170" text-anchor="middle" class="cn nodeSub">确定本轮图片范围</text>
    <rect x="1030" y="84" width="270" height="118" rx="16" class="node"/>
    <text x="1165" y="126" text-anchor="middle" class="cn nodeTitle">上下文整理</text><text x="1165" y="164" text-anchor="middle" class="cn nodeSub">任务所需会话信息</text>
    <rect x="1380" y="84" width="270" height="118" rx="16" class="node2"/>
    <text x="1515" y="132" text-anchor="middle" class="cn nodeTitle">VQA / Description</text><text x="1515" y="170" text-anchor="middle" class="cn nodeSub">任务专用 Prompt</text>
    <rect x="1730" y="84" width="270" height="118" rx="16" class="node"/>
    <text x="1865" y="132" text-anchor="middle" class="cn nodeTitle">模型执行</text><text x="1865" y="170" text-anchor="middle" class="cn nodeSub">Self-hosted / Cloud</text>
    <rect x="2080" y="84" width="270" height="118" rx="16" class="node2"/>
    <text x="2215" y="132" text-anchor="middle" class="cn nodeTitle">结果解析 → 回答</text><text x="2215" y="170" text-anchor="middle" class="cn nodeSub">Schema / Parser</text>
    <path d="M600 143 H680" class="arrow"/><path d="M950 143 H1030" class="arrow"/><path d="M1300 143 H1380" class="arrow"/><path d="M1650 143 H1730" class="arrow"/><path d="M2000 143 H2080" class="arrow"/>
  </g>

  <!-- Retrieval -->
  <g>
    <rect x="330" y="346" width="270" height="118" rx="16" class="node"/>
    <text x="465" y="394" text-anchor="middle" class="cn nodeTitle">文本 / 图片 / 图文</text><text x="465" y="432" text-anchor="middle" class="cn nodeSub">多模态查询</text>
    <rect x="680" y="346" width="270" height="118" rx="16" class="node2"/>
    <text x="815" y="394" text-anchor="middle" class="cn nodeTitle">Embedding</text><text x="815" y="432" text-anchor="middle" class="cn nodeSub">2048D 或 2560D</text>
    <rect x="1030" y="346" width="270" height="118" rx="16" class="node"/>
    <text x="1165" y="394" text-anchor="middle" class="cn nodeTitle">L2 normalize</text><text x="1165" y="432" text-anchor="middle" class="cn nodeSub">归一化向量</text>
    <rect x="1380" y="346" width="270" height="118" rx="16" class="node2"/>
    <text x="1515" y="394" text-anchor="middle" class="cn nodeTitle">Faiss IndexFlatIP</text><text x="1515" y="432" text-anchor="middle" class="cn nodeSub">精确内积检索</text>
    <rect x="1730" y="346" width="270" height="118" rx="16" class="node"/>
    <text x="1865" y="394" text-anchor="middle" class="cn nodeTitle">Top-K 结果</text><text x="1865" y="432" text-anchor="middle" class="cn nodeSub">排序后的资产</text>
    <rect x="2080" y="346" width="270" height="118" rx="16" class="node2"/>
    <text x="2215" y="394" text-anchor="middle" class="cn nodeTitle">SEARCH_n</text><text x="2215" y="432" text-anchor="middle" class="cn nodeSub">加入当前对话</text>
    <path d="M600 405 H680" class="arrow"/><path d="M950 405 H1030" class="arrow"/><path d="M1300 405 H1380" class="arrow"/><path d="M1650 405 H1730" class="arrow"/><path d="M2000 405 H2080" class="arrow"/>
    <rect x="360" y="477" width="560" height="34" rx="17" class="optional"/>
    <text x="640" y="501" text-anchor="middle" class="cn note">可选增强：Query Understanding / 经过复核的可见文字</text>
  </g>

  <!-- Compare / Rank -->
  <g>
    <rect x="330" y="608" width="270" height="118" rx="16" class="node"/>
    <text x="465" y="656" text-anchor="middle" class="cn nodeTitle">自然语言请求</text><text x="465" y="694" text-anchor="middle" class="cn nodeSub">保留原始任务语义</text>
    <rect x="680" y="608" width="270" height="118" rx="16" class="node2"/>
    <text x="815" y="656" text-anchor="middle" class="cn nodeTitle">Router</text><text x="815" y="694" text-anchor="middle" class="cn nodeSub">开放问题保留原语义</text>
    <rect x="1030" y="608" width="270" height="118" rx="16" class="node"/>
    <text x="1165" y="646" text-anchor="middle" class="cn nodeTitle">明确选择 / 排序</text><text x="1165" y="686" text-anchor="middle" class="cn nodeSub">再调用对应工具</text>
    <rect x="1380" y="608" width="270" height="118" rx="16" class="node2"/>
    <text x="1515" y="656" text-anchor="middle" class="cn nodeTitle">图片引用解析</text><text x="1515" y="694" text-anchor="middle" class="cn nodeSub">确定图片集合</text>
    <rect x="1730" y="608" width="270" height="118" rx="16" class="node"/>
    <text x="1865" y="656" text-anchor="middle" class="cn nodeTitle">Compare / Rank</text><text x="1865" y="694" text-anchor="middle" class="cn nodeSub">Prompt + Provider VLM</text>
    <rect x="2080" y="608" width="270" height="118" rx="16" class="node2"/>
    <text x="2215" y="656" text-anchor="middle" class="cn nodeTitle">Parser → 结果</text><text x="2215" y="694" text-anchor="middle" class="cn nodeSub">比较 / 选择 / 排序</text>
    <path d="M600 667 H680" class="arrow"/><path d="M950 667 H1030" class="arrow"/><path d="M1300 667 H1380" class="arrow"/><path d="M1650 667 H1730" class="arrow"/><path d="M2000 667 H2080" class="arrow"/>
  </g>

  <!-- Content -->
  <g>
    <rect x="330" y="870" width="270" height="118" rx="16" class="node"/>
    <text x="465" y="918" text-anchor="middle" class="cn nodeTitle">图片 + 内容任务</text><text x="465" y="956" text-anchor="middle" class="cn nodeSub">一图 / 多图 + Profile</text>
    <rect x="680" y="870" width="270" height="118" rx="16" class="node2"/>
    <text x="815" y="918" text-anchor="middle" class="cn nodeTitle">图片引用解析</text><text x="815" y="956" text-anchor="middle" class="cn nodeSub">确定图片集合</text>
    <rect x="1030" y="870" width="270" height="118" rx="16" class="node"/>
    <text x="1165" y="910" text-anchor="middle" class="cn nodeTitle">Story Prompt</text><text x="1165" y="950" text-anchor="middle" class="cn nodeSub">或 Content Prompt + Profile</text>
    <rect x="1380" y="870" width="270" height="118" rx="16" class="node2"/>
    <text x="1515" y="918" text-anchor="middle" class="cn nodeTitle">模型执行</text><text x="1515" y="956" text-anchor="middle" class="cn nodeSub">Standard / High-quality</text>
    <rect x="1730" y="870" width="270" height="118" rx="16" class="node"/>
    <text x="1865" y="918" text-anchor="middle" class="cn nodeTitle">结果解析与长度校验</text><text x="1865" y="956" text-anchor="middle" class="cn nodeSub">Schema / Parser</text>
    <rect x="2080" y="870" width="270" height="118" rx="16" class="node2"/>
    <text x="2215" y="910" text-anchor="middle" class="cn nodeTitle">故事 / 文案 / 标题</text><text x="2215" y="950" text-anchor="middle" class="cn nodeSub">可直接使用的内容输出</text>
    <path d="M600 929 H680" class="arrow"/><path d="M950 929 H1030" class="arrow"/><path d="M1300 929 H1380" class="arrow"/><path d="M1650 929 H1730" class="arrow"/><path d="M2000 929 H2080" class="arrow"/>
  </g>
</svg>
